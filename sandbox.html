<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Services Sandbox</title>

  <!-- Sassをビルドして出力するCSS（パスはお好みでOK） -->
  <link rel="stylesheet" href="assets/css/sandbox.css" />
</head>
<body>

  <main class="sandbox-wrap">
  <section class="services-sandbox">

  <!-- タイトル（右寄せ） -->
  <div class="services__title-block">
    <h2 class="section-title">
      <img src="assets/imgs/icon-shippou.svg" alt="" class="section-icon" aria-hidden="true">
      Service
    </h2>
  </div>

  <!-- あなたの想い〜（中央寄せ） -->
  <div class="services__description-block">
    <p class="section-description">
      あなたの想いをデザインとテクノロジーでカタチにします。
    </p>
  </div>

  

  <!-- 丸カード -->
  <div class="service-grid">

     <img src="assets/imgs/cloud.png"  alt="" class="cloud cloud--top"    aria-hidden="true">
    <img src="assets/imgs/cloud.png" alt="" class="cloud cloud--bottom" aria-hidden="true">

    <div class="card is-design">
      <img src="assets/imgs/service-img01.png" alt="" class="card-icon">
      <h3 class="card-title">デザイン</h3>
      <p class="card-text">想いを形にするビジュアル設計<br>トーン&マナーを揃え、伝わる世界観をつくります。</p>
    </div>
    <div class="card is-coding">
      <img src="assets/imgs/service-img02.png" alt="" class="card-icon">
      <h3 class="card-title">コーディング</h3>
      <p class="card-text"> デザインを正確かつ軽量に実装<br>アクセシビリティと表示速度も意識して仕上げます。
</p>
    </div>
    <div class="card is-training">
      <img src="assets/imgs/service-img03.png" alt="" class="card-icon">
      <h3 class="card-title">伴走サポート</h3>
      <p class="card-text">Canva/更新運用のレクチャーや、内製化の支援でチームの<br>スキルアップを支えます。</p>
    </div>
  </div>

</section>

  </main>

</body>
</html>
